<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — HackMe</title><link rel="stylesheet" href="css/style.css"></head>
<body class="center-page">
  <div class="auth-card glass">
    <a class="brand" href="index.html"><span>H</span> HackMe</a>
    <div class="eyebrow">WELCOME BACK</div>
    <h1>Enter HackMe.</h1>
    <p class="muted">Use a username to start your student profile.</p>
    <form id="loginForm">
      <label>Username<input id="username" required minlength="2" maxlength="32" placeholder="e.g. mohin"></label>
      <button class="btn btn-primary full">Continue →</button>
    </form>
    <p class="tiny">Demo authentication uses your browser's localStorage. Supabase can be added later.</p>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
